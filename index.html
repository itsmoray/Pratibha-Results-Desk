<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratibha Results Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16213A; --ink2:#243352; --paper:#F2F4F7; --card:#fff; --line:#DCE1E8;
  --muted:#5B6678; --gold:#E8A317; --gold-soft:#FCF1D6; --teal:#0F766E; --teal-soft:#DDF3EF;
  --danger:#B42318; --danger-soft:#FDE8E6;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:var(--ink)}
.login-box{width:100%;max-width:380px;background:var(--card);border-radius:14px;padding:28px 24px}
.login-box h1{font-size:30px;font-weight:800}
.login-box p{color:var(--muted);margin:6px 0 20px}

/* fields */
label{display:block;font-weight:600;font-size:14px;margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
fieldset{border:1.5px solid var(--line);border-radius:10px;margin:0 0 12px;padding:6px 12px 12px}
legend{font-family:var(--head);font-weight:600;padding:0 6px}
fieldset input{margin-top:8px}
.err{color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:9px 12px;margin:0 0 12px;font-size:14px}

/* buttons */
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;background:var(--ink);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.small{padding:7px 11px;font-size:14px}
.btn.block{width:100%}

/* header + progress */
.top{background:var(--ink);color:#fff;padding:12px 16px 14px}
.top-row{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.brand{font-family:var(--head);font-weight:800;font-size:20px;flex:1}
.who{font-size:13px;opacity:.85;text-align:right;line-height:1.25}
.top .btn{background:var(--ink2);padding:7px 11px;font-size:14px}
.prog{max-width:960px;margin:12px auto 0}
.prog-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.prog-label b{font-family:var(--head);font-size:18px}
.strip{display:flex;gap:2px;height:12px}
.strip i{flex:1;background:var(--ink2);border-radius:2px}
.strip i.on{background:var(--gold)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:0;z-index:5}
.tabs button{border:0;background:none;padding:14px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:960px;margin:0 auto;padding:16px}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.controls input{margin:0;flex:1;min-width:180px}
.chips{display:flex;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* lists */
.list{display:grid;gap:10px}
@media(min-width:720px){.list{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;width:100%;display:block}
button.item:hover{border-color:var(--ink)}
.item h3{font-size:18px;font-weight:600}
.meta{color:var(--muted);font-size:14px;margin-top:3px}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pill{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.done{background:var(--teal-soft);color:var(--teal)}
.pill.wait{background:var(--gold-soft);color:#8A5B00}
.pill.off{background:var(--danger-soft);color:var(--danger)}
.win{margin:10px 0 0;padding:0;list-style:none;font-size:15px}
.win li{display:flex;gap:8px;padding:3px 0;border-top:1px solid var(--line)}
.win li:first-child{border-top:0}
.win .pl{flex:0 0 76px;color:var(--muted);font-weight:600;font-size:14px}
.win .n{font-weight:600}
.win small{color:var(--muted);display:block;font-weight:400}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted)}
.waiting{font-size:14px;color:var(--muted);margin-top:16px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* dialog */
dialog{border:0;border-radius:14px;padding:22px 20px;width:calc(100% - 24px);max-width:480px;max-height:92dvh;overflow:auto}
dialog::backdrop{background:rgba(22,33,58,.6)}
dialog h2{font-size:22px}
.sub{color:var(--muted);margin:4px 0 16px}
.checks{max-height:200px;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:5px}
.checks label{display:flex;gap:10px;align-items:center;font-weight:400;margin:0;padding:6px 0}
.checks input{width:auto;margin:0}
.inline{display:flex;gap:8px}
.inline input{flex:1}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;z-index:99;max-width:90%;font-weight:500}
#toast.bad{background:var(--danger)}
@media(prefers-reduced-motion:no-preference){.strip i{transition:background .4s}}

/* loading + polish */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.btn:disabled::after{content:'';display:inline-block;width:14px;height:14px;margin-left:9px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.sk-l{height:14px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,#E6EAF0 25%,#F4F6F9 50%,#E6EAF0 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk-l.w60{width:60%;height:18px}.sk-l.w40{width:40%}
.strip.loading i{background:linear-gradient(90deg,var(--ink2) 25%,#35476E 50%,var(--ink2) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
#topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;background:linear-gradient(90deg,transparent,var(--gold),transparent) no-repeat;background-size:50% 100%;animation:slide 1s linear infinite}
#topbar.on{opacity:1}
.splash{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:50}
.spin{width:38px;height:38px;border:4px solid var(--ink2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:var(--paper);font-size:22px;line-height:1;color:var(--ink)}
.x:hover{background:var(--line)}
dialog h2{padding-right:40px}
@media(prefers-reduced-motion:no-preference){
  dialog[open]{animation:pop .18s ease-out}
  dialog[open]::backdrop{animation:fade .18s}
  #toast{animation:up .2s ease-out}
}
@media(prefers-reduced-motion:reduce){.sk-l,.strip.loading i,#topbar,.spin,.btn:disabled::after{animation-duration:3s}}
</style>
</head>
<body>
<div id="topbar"></div>
<div class="splash" id="splash" hidden><div class="spin" role="status" aria-label="Loading"></div></div>

<!-- LOGIN -->
<section class="login" id="login" hidden>
  <form class="login-box" id="loginForm">
    <h1>Pratibha Results Desk</h1>
    <p>Sign in to enter or view event results.</p>
    <div class="err" id="loginErr" hidden></div>
    <label>Username <input id="lu" autocomplete="username" autocapitalize="none" required></label>
    <label>Password <input id="lp" type="password" autocomplete="current-password" required></label>
    <button class="btn gold block" id="lbtn">Sign in</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand">Pratibha Results</div>
      <div class="who" id="who"></div>
      <button class="btn" onclick="openPassword()">Password</button>
      <button class="btn" onclick="logout()">Sign out</button>
    </div>
    <div class="prog">
      <div class="prog-label"><span id="pmain">Loading events…</span><span id="pl"></span></div>
      <div class="strip loading" id="strip" aria-hidden="true"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script>
/* ====== CONFIG ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwXZfCpI8nqu6qrWPVbdcbvQsfTmj8de-UhBTm9Wr7nTC-6S7nCoP2Q-Chyui2AcjDM/exec';
const POLL_MS = 15000;

/* ====== STATE + HELPERS ====== */
const S = { token:'', me:null, events:[], results:{}, users:[], tab:'', filter:'all', q:'' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

let toastT;
function toast(msg, bad){
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200);
}

let pending = 0;
async function api(action, payload = {}, silent){
  if (API_URL.startsWith('PASTE')) throw new Error('Set API_URL in index.html first');
  if (!silent){ pending++; $('#topbar').classList.add('on'); }
  try {
    let res;
    try { res = await fetch(API_URL, { method:'POST', redirect:'follow', body: JSON.stringify({ action, token:S.token, ...payload }) }); }
    catch(e){ throw new Error('No connection. Check your internet and try again.'); }
    let j;
    try { j = await res.json(); } catch(e){ throw new Error('Server sent an unexpected reply. Check the web app deployment.'); }
    if (!j.ok){
      if (j.code === 'AUTH') endSession(j.error);
      throw new Error(j.error || 'Something went wrong');
    }
    return j;
  } finally {
    if (!silent){ pending--; if (!pending) $('#topbar').classList.remove('on'); }
  }
}

function fmtTime(iso){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const t = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { day:'numeric', month:'short' }) + ', ' + t;
}
const isDone = id => !!(S.results[id] && S.results[id].p1);
const role = () => S.me ? S.me.role : '';
const dlg = $('#dlg');
function openDlg(html){
  dlg.innerHTML = '<button type="button" class="x" onclick="closeDlg()" aria-label="Close">×</button>' + html;
  if (!dlg.open) dlg.showModal();
  const f = dlg.querySelector('input:not([hidden]),select,textarea');
  if (f && !matchMedia('(pointer:coarse)').matches) f.focus();
}
function confirmBox(title, msg, okLabel){
  return new Promise(res => {
    let done = false;
    const fin = v => { if (done) return; done = true; dlg.removeEventListener('close', onClose); res(v); };
    const onClose = () => fin(false);
    dlg.addEventListener('close', onClose);
    openDlg(`<h2>${esc(title)}</h2><p class="sub">${esc(msg)}</p><div class="actions"><button type="button" class="btn ghost" id="cn">Cancel</button><button type="button" class="btn danger" id="cy">${esc(okLabel)}</button></div>`);
    $('#cn').onclick = () => closeDlg();
    $('#cy').onclick = () => { fin(true); closeDlg(); };
  });
}
function closeDlg(){ if (dlg.open) dlg.close(); }

/* ====== AUTH ====== */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#lbtn'), er = $('#loginErr'); er.hidden = true; b.disabled = true; b.textContent = 'Signing in';
  try {
    const j = await api('login', { username:$('#lu').value, password:$('#lp').value });
    S.token = j.token; S.me = j.me; store.set('prt_token', j.token); store.set('prt_me', JSON.stringify(j.me));
    $('#lp').value = ''; showApp(); loadFirst();
  } catch(err){ er.textContent = err.message; er.hidden = false; }
  b.disabled = false; b.textContent = 'Sign in';
});

let pollT;
function endSession(msg){
  S.token = ''; S.me = null; S.loaded = false; S.events = []; S.results = {}; S.users = []; S.usersLoaded = false;
  store.del('prt_token'); store.del('prt_me'); clearInterval(pollT);
  closeDlg(); $('#splash').hidden = true; $('#app').hidden = true; $('#login').hidden = false;
  const er = $('#loginErr'); if (msg){ er.textContent = msg; er.hidden = false; } else er.hidden = true;
}
async function logout(){ try{ await api('logout'); }catch(e){} endSession(); }

function paintWho(){ $('#who').innerHTML = esc(S.me.name || '') + '<br>' + esc(S.me.role || ''); }
function showApp(){
  $('#login').hidden = true; $('#app').hidden = false;
  paintWho(); buildTabs(); paintProgress();
  clearInterval(pollT); pollT = setInterval(poll, POLL_MS);
}
async function poll(){ if (document.hidden || dlg.open || !S.token || !S.loaded) return; try{ await refresh(); }catch(e){} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

async function loadFirst(){
  S.loaded = false; paintProgress(); paint();
  try { await refresh(); }
  catch(e){ if (S.token) showRetry(e.message); }
}
function showRetry(msg){
  $('#view').innerHTML = `<div class="empty">${esc(msg)}<br><br><button class="btn" onclick="retry()">Try again</button></div>`;
}
function retry(){ setTab(S.tab || tabsFor()[0][0]); loadFirst(); }

async function refresh(){
  const j = await api('data', {}, S.loaded);
  const roleChanged = !S.me || S.me.role !== j.me.role;
  S.events = j.events; S.results = j.results; S.loaded = true; S.me = j.me;
  store.set('prt_me', JSON.stringify(j.me)); paintWho();
  if (roleChanged) buildTabs();
  paintProgress(); paint();
}

/* ====== PROGRESS ====== */
function paintProgress(){
  const st = $('#strip');
  if (!S.loaded){
    $('#pmain').textContent = 'Loading events…'; $('#pl').textContent = '';
    st.classList.add('loading'); st.innerHTML = '<i></i>'.repeat(31); return;
  }
  st.classList.remove('loading');
  const total = S.events.length, done = S.events.filter(e => isDone(e.id)).length;
  $('#pmain').innerHTML = `<b>${done}</b> of ${total} events declared`;
  $('#pl').textContent = total ? Math.round(done * 100 / total) + '%' : '';
  st.innerHTML = S.events.map(e => `<i class="${isDone(e.id) ? 'on' : ''}"></i>`).join('');
}

/* ====== TABS ====== */
function tabsFor(){
  const t = [];
  if (role() === 'admin' || role() === 'faculty') t.push(['enter', role() === 'admin' ? 'All events' : 'My events']);
  t.push(['board', 'Results']);
  if (role() === 'admin'){ t.push(['users', 'Users']); t.push(['manage', 'Manage events']); }
  return t;
}
function buildTabs(){
  const t = tabsFor();
  $('#tabs').innerHTML = t.map(([k,l]) => `<button role="tab" data-k="${k}" onclick="setTab('${k}')">${l}</button>`).join('');
  setTab(t[0][0]);
}
async function setTab(k){
  S.tab = k; S.filter = 'all'; S.q = '';
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.k === k));
  const v = $('#view');
  if (k === 'enter'){
    v.innerHTML = `<div class="controls"><input id="q" type="search" placeholder="Search events" oninput="S.q=this.value;paint()">
      <div class="chips">${['all','pending','declared'].map(f => `<button class="chip" data-f="${f}" aria-pressed="${f==='all'}" onclick="setFilter('${f}')">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div></div><div id="list" class="list"></div>`;
  } else if (k === 'board'){
    const canX = role() === 'admin' || role() === 'committee';
    v.innerHTML = `<div class="controls"><input id="q" type="search" placeholder="Search declared results" oninput="S.q=this.value;paint()">
      ${canX ? '<button class="btn gold" onclick="exportXlsx()">Download Excel</button>' : ''}</div><div id="list" class="list"></div><p class="waiting" id="waiting"></p>`;
  } else if (k === 'users'){
    v.innerHTML = `<div class="bar"><button class="btn gold" onclick="openUser()">Add user</button></div><div id="list" class="list"></div>`;
    S.usersLoaded = false; paint();
    try { S.users = (await api('listUsers')).users; } catch(e){ toast(e.message, true); }
    S.usersLoaded = true;
  } else if (k === 'manage'){
    v.innerHTML = `<form class="item" id="af" style="margin-bottom:14px"><h3>Add an event</h3><p class="meta" style="margin-bottom:12px">Fill in the details and save. Venue can be added later.</p>
      <label>Event name <input name="name" placeholder="e.g. Group Song (Indian)" autocomplete="off" required></label>
      ${catField('Off-Stage')}
      <label>Venue <input name="venue" list="venues" placeholder="Optional" autocomplete="off"></label>
      <datalist id="venues">${[...new Set(S.events.map(e => e.venue).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <div class="actions" style="margin-top:4px"><button class="btn gold" id="addOneBtn">Add event</button></div></form>
      <details class="item" style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:600">Add many events at once</summary>
      <p class="meta">One event per line: Name | Category | Venue</p>
      <textarea id="bulk" rows="5" placeholder="Group Song | On-Stage Group | Main Auditorium"></textarea>
      <div class="actions"><button type="button" class="btn ghost" id="addBtn" onclick="addEvents()">Add events</button></div></details>
      <div class="controls"><input id="q" type="search" placeholder="Search events" oninput="S.q=this.value;paint()"></div><div id="list" class="list"></div>`;
    $('#af').addEventListener('submit', addOne);
  }
  paint();
}
function setFilter(f){
  S.filter = f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === f));
  paint();
}

/* ====== PAINT ====== */
function match(e){ const q = S.q.trim().toLowerCase(); return !q || (e.name + ' ' + e.category + ' ' + e.venue).toLowerCase().includes(q); }

const SKELETON = '<div class="item"><div class="sk-l w60"></div><div class="sk-l w40"></div></div>'.repeat(6);
function paint(){
  const L = $('#list'); if (!L) return;
  if (!S.loaded || (S.tab === 'users' && !S.usersLoaded)){
    L.innerHTML = SKELETON; const w = $('#waiting'); if (w) w.textContent = ''; return;
  }
  if (S.tab === 'enter'){
    const list = S.events.filter(e => e.canEdit && match(e) &&
      (S.filter === 'all' || (S.filter === 'declared') === isDone(e.id)));
    if (!list.length){
      const none = !S.events.some(e => e.canEdit);
      L.innerHTML = `<div class="empty">${none ? 'No events are assigned to you yet. Ask the admin to assign your events.' : 'No events match.'}</div>`; return;
    }
    L.innerHTML = list.map(e => {
      const r = S.results[e.id];
      return `<button class="item" onclick="openEditor('${e.id}')"><div class="row"><h3>${esc(e.name)}</h3>
        <span class="pill ${r ? 'done' : 'wait'}">${r ? 'Declared' : 'Pending'}</span></div>
        <div class="meta">${esc([e.category, e.venue].filter(Boolean).join(', '))}</div>
        ${r ? `<div class="meta">1st: ${esc(r.p1)}</div>` : ''}</button>`;
    }).join('');
  }
  else if (S.tab === 'board'){
    const list = S.events.filter(e => isDone(e.id) && match(e))
      .sort((a,b) => (S.results[b.id].at || '').localeCompare(S.results[a.id].at || ''));
    L.innerHTML = list.length ? list.map(e => {
      const r = S.results[e.id];
      const rows = [['1st','p1','c1'],['2nd','p2','c2'],['3rd','p3','c3'],['Runner-up','p4','c4']]
        .filter(x => r[x[1]]).map(x => `<li><span class="pl">${x[0]}</span><span class="n">${esc(r[x[1]])}${r[x[2]] ? `<small>${esc(r[x[2]])}</small>` : ''}</span></li>`).join('');
      return `<div class="item"><div class="row"><h3>${esc(e.name)}</h3><span class="pill done">${esc(fmtTime(r.at))}</span></div>
        <div class="meta">${esc([e.category, e.venue].filter(Boolean).join(', '))}</div><ul class="win">${rows}</ul>
        ${r.notes ? `<div class="note">${esc(r.notes)}</div>` : ''}<div class="note">Entered by ${esc(r.by)}</div></div>`;
    }).join('') : '<div class="empty">No results declared yet. New results appear here within seconds.</div>';
    const pend = S.events.filter(e => !isDone(e.id));
    $('#waiting').textContent = pend.length ? 'Waiting for: ' + pend.map(e => e.name).join(', ') : 'All events declared.';
  }
  else if (S.tab === 'users'){
    L.innerHTML = S.users.length ? S.users.map(u => `<div class="item"><div class="row"><h3>${esc(u.name)}</h3>
      <span class="pill ${u.active ? 'done' : 'off'}">${u.active ? esc(u.role) : 'Disabled'}</span></div>
      <div class="meta">${esc(u.username)}${u.role === 'faculty' ? ', ' + (u.events === 'ALL' ? 'all events' : (u.events ? u.events.split(',').length : 0) + ' events') : ''}</div>
      <div class="actions" style="margin-top:10px"><button class="btn ghost small" onclick="openUser('${esc(u.username)}')">Edit</button>
      ${u.username === S.me.username ? '' : `<button class="btn ghost small" onclick="delUser('${esc(u.username)}')">Delete</button>`}</div></div>`).join('')
      : '<div class="empty">No users yet.</div>';
  }
  else if (S.tab === 'manage'){
    const list = S.events.filter(match);
    L.innerHTML = list.length ? list.map(e => `<div class="item"><div class="row"><h3>${esc(e.name)}</h3>
      <div style="display:flex;gap:6px"><button class="btn ghost small" onclick="openEventEdit('${e.id}')">Edit</button>
      <button class="btn ghost small" onclick="delEvent('${e.id}')">Delete</button></div></div>
      <div class="meta">${esc(e.id)}${e.category ? ', ' + esc(e.category) : ''}${e.venue ? ', ' + esc(e.venue) : ''}</div></div>`).join('')
      : '<div class="empty">No events yet. Add your event list above.</div>';
  }
}

/* ====== RESULT EDITOR ====== */
function openEditor(id){
  const e = S.events.find(x => x.id === id), r = S.results[id] || {};
  const rows = [['1st place','1'],['2nd place','2'],['3rd place','3'],['Runner-up','4']];
  openDlg(`<h2>${esc(e.name)}</h2><p class="sub">${esc([e.category, e.venue].filter(Boolean).join(', '))}${r.at ? ' · last saved ' + esc(fmtTime(r.at)) : ''}</p>
  <div class="err" id="fe" hidden></div>
  <form id="rf">${rows.map(([l,n]) => `<fieldset><legend>${l}</legend>
    <input name="p${n}" placeholder="Winner or team name${n==='1' ? ' (required)' : ''}" value="${esc(r['p'+n])}" ${n==='1' ? 'required' : ''} autocomplete="off">
    <input name="c${n}" placeholder="Class or department" value="${esc(r['c'+n])}" autocomplete="off"></fieldset>`).join('')}
  <label>Notes <textarea name="notes" rows="2" placeholder="Optional">${esc(r.notes)}</textarea></label>
  <div class="actions"><button type="button" class="btn ghost" onclick="closeDlg()">Cancel</button><button class="btn gold" id="sb">Save result</button></div></form>`);
  $('#rf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const fd = Object.fromEntries(new FormData(ev.target)), b = $('#sb'), er = $('#fe');
    er.hidden = true; b.disabled = true; b.textContent = 'Saving…';
    try { await api('saveResult', { eventId:id, result:fd }); closeDlg(); toast('Result saved'); await refresh(); }
    catch(err){ er.textContent = err.message; er.hidden = false; b.disabled = false; b.textContent = 'Save result'; }
  });
}

/* ====== PASSWORD ====== */
function openPassword(){
  openDlg(`<h2>Change password</h2><p class="sub">Use at least 6 characters.</p><div class="err" id="fe" hidden></div>
  <form id="pf"><label>Current password <input name="o" type="password" autocomplete="current-password" required></label>
  <label>New password <input name="n" type="password" autocomplete="new-password" minlength="6" required></label>
  <div class="actions"><button type="button" class="btn ghost" onclick="closeDlg()">Cancel</button><button class="btn gold">Change password</button></div></form>`);
  $('#pf').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = ev.target;
    try { const j = await api('changePassword', { oldPassword:f.o.value, newPassword:f.n.value }); S.token = j.token; store.set('prt_token', j.token); closeDlg(); toast('Password changed'); }
    catch(err){ $('#fe').textContent = err.message; $('#fe').hidden = false; }
  });
}

/* ====== USERS (admin) ====== */
function genPw(){ const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let p = ''; for (let i = 0; i < 8; i++) p += a[Math.floor(Math.random() * a.length)]; return p; }

function openUser(username){
  const u = username ? S.users.find(x => x.username === username) : null;
  const sel = u ? (u.events === 'ALL' ? 'ALL' : u.events.split(',')) : [];
  openDlg(`<h2>${u ? 'Edit user' : 'Add user'}</h2><p class="sub">${u ? esc(u.username) : 'Faculty sign in with the username and password you set here.'}</p>
  <div class="err" id="fe" hidden></div>
  <form id="uf">
  ${u ? '' : '<label>Username <input name="username" autocapitalize="none" autocomplete="off" required></label>'}
  <label>Full name <input name="name" value="${esc(u ? u.name : '')}" required></label>
  <label>Role <select name="role" id="ur"><option value="faculty">Faculty (enters results)</option><option value="committee">Committee (views results)</option><option value="admin">Admin (full access)</option></select></label>
  <label>${u ? 'New password (leave empty to keep)' : 'Password'}
    <span class="inline"><input name="password" id="upw" autocomplete="new-password" ${u ? '' : 'required'} minlength="6"><button type="button" class="btn ghost small" onclick="$('#upw').value=genPw()">Generate</button></span></label>
  ${u ? `<label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" name="active" style="width:auto;margin:0" ${u.active ? 'checked' : ''}> Account active</label>` : ''}
  <div id="evbox"><label>Events this faculty can enter
    <div class="checks" id="evl">
      <label><input type="checkbox" id="all" ${sel === 'ALL' ? 'checked' : ''}> All events</label>
      ${S.events.map(e => `<label><input type="checkbox" class="ev" value="${e.id}" ${sel !== 'ALL' && sel.includes(e.id) ? 'checked' : ''} ${sel === 'ALL' ? 'disabled' : ''}> ${esc(e.name)}</label>`).join('')}
    </div></label></div>
  <div class="actions"><button type="button" class="btn ghost" onclick="closeDlg()">Cancel</button><button class="btn gold" id="sb">${u ? 'Save changes' : 'Create user'}</button></div></form>`);
  const f = $('#uf'); f.role.value = u ? u.role : 'faculty';
  const sync = () => { $('#evbox').hidden = f.role.value !== 'faculty'; };
  f.role.addEventListener('change', sync); sync();
  $('#all').addEventListener('change', e => document.querySelectorAll('.ev').forEach(c => { c.disabled = e.target.checked; }));
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const events = $('#all').checked ? 'ALL' : [...document.querySelectorAll('.ev:checked')].map(c => c.value).join(',');
    const p = { name:f.name.value, role:f.role.value, events, password:f.password.value };
    const b = $('#sb'); b.disabled = true;
    try {
      if (u){ p.username = u.username; p.active = f.active.checked; await api('updateUser', p); }
      else { p.username = f.username.value; await api('createUser', p); }
      closeDlg(); toast(u ? 'User updated' : 'User created');
      S.users = (await api('listUsers')).users; paint();
    } catch(err){ $('#fe').textContent = err.message; $('#fe').hidden = false; b.disabled = false; }
  });
}
async function delUser(un){
  if (!await confirmBox('Delete user?', un + ' will no longer be able to sign in. Results they saved are kept.', 'Delete user')) return;
  try { await api('deleteUser', { username:un }); toast('User deleted'); S.users = (await api('listUsers')).users; paint(); }
  catch(e){ toast(e.message, true); }
}

/* ====== EVENTS (admin) ====== */
const CATS = ['Off-Stage', 'On-Stage Individual', 'On-Stage Group'];
function catField(cur){
  const known = !cur || CATS.includes(cur);
  return `<label>Category <select name="cat" onchange="this.form.other.hidden = this.value !== '__other'">
    ${CATS.map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}
    <option value="__other" ${known ? '' : 'selected'}>Other…</option></select>
    <input name="other" placeholder="Type the new category" value="${known ? '' : esc(cur)}" ${known ? 'hidden' : ''}></label>`;
}
const readCat = f => f.cat.value === '__other' ? f.other.value.trim() : f.cat.value;
async function addOne(ev){
  ev.preventDefault(); const f = ev.target, b = $('#addOneBtn'); b.disabled = true;
  try {
    await api('addEvents', { items:[{ name:f.name.value, category:readCat(f), venue:f.venue.value }] });
    f.name.value = ''; f.venue.value = ''; toast('Event added'); await refresh(); f.name.focus();
  } catch(e){ toast(e.message, true); }
  b.disabled = false;
}
async function addEvents(){
  const items = $('#bulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split('|').map(x => x.trim()); return { name:p[0], category:p[1] || '', venue:p[2] || '' };
  });
  if (!items.length) return toast('Type at least one event first', true);
  const b = $('#addBtn'); b.disabled = true;
  try { const j = await api('addEvents', { items }); $('#bulk').value = ''; toast(j.added + ' events added'); await refresh(); }
  catch(e){ toast(e.message, true); }
  b.disabled = false;
}
function openEventEdit(id){
  const e = S.events.find(x => x.id === id);
  openDlg(`<h2>Edit event</h2><p class="sub">Winners already saved for this event are kept.</p><div class="err" id="fe" hidden></div>
  <form id="ef"><label>Event name <input name="name" value="${esc(e.name)}" required></label>
  ${catField(e.category)}
  <label>Venue <input name="venue" value="${esc(e.venue)}"></label>
  <div class="actions"><button type="button" class="btn ghost" onclick="closeDlg()">Cancel</button><button class="btn gold" id="sb">Save changes</button></div></form>`);
  $('#ef').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = ev.target, b = $('#sb'); b.disabled = true;
    try { await api('updateEvent', { id, name:f.name.value, category:readCat(f), venue:f.venue.value }); closeDlg(); toast('Event updated'); await refresh(); }
    catch(err){ $('#fe').textContent = err.message; $('#fe').hidden = false; b.disabled = false; }
  });
}
async function delEvent(id){
  const e = S.events.find(x => x.id === id);
  if (!await confirmBox('Delete event?', e.name + ' and any saved winners for it will be removed.', 'Delete event')) return;
  try { await api('deleteEvent', { id }); toast('Event deleted'); await refresh(); } catch(err){ toast(err.message, true); }
}

/* ====== EXPORT ====== */
function exportXlsx(){
  const rows = S.events.map(e => {
    const r = S.results[e.id] || {};
    return { 'Event':e.name, 'Category':e.category, 'Venue':e.venue,
      '1st':r.p1||'', '1st class':r.c1||'', '2nd':r.p2||'', '2nd class':r.c2||'',
      '3rd':r.p3||'', '3rd class':r.c3||'', 'Runner-up':r.p4||'', 'Runner-up class':r.c4||'',
      'Notes':r.notes||'', 'Entered by':r.by||'', 'Saved at':r.at ? new Date(r.at).toLocaleString() : '' };
  });
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Results');
  XLSX.writeFile(wb, 'Pratibha_Results.xlsx');
}

/* ====== BOOT ====== */
(function(){
  const t = store.get('prt_token'); let me = null;
  try { me = JSON.parse(store.get('prt_me') || 'null'); } catch(e){}
  if (!t){ $('#login').hidden = false; return; }          // never signed in: show login
  S.token = t;
  if (me){ S.me = me; showApp(); loadFirst(); return; }   // signed in: go straight to the app
  $('#splash').hidden = false;                            // signed in but profile not cached yet
  api('data').then(j => {
    S.me = j.me; store.set('prt_me', JSON.stringify(j.me));
    $('#splash').hidden = true; showApp(); loadFirst();
  }).catch(() => { $('#splash').hidden = true; if (S.token) $('#login').hidden = false; });
})();
</script>
